{% extends 'base.html' %}
{% block extra_head %}
<style>
    .login-page {
        min-height: calc(100vh - 56px);
        padding: 32px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-panel {
        width: 100%;
        max-width: 460px;
        padding: 24px;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .login-title {
        margin: 0 0 20px;
        color: #212529;
        font-size: 26px;
        font-weight: 700;
        line-height: 1.2;
        text-align: center;
    }

    .login-primary-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
    }

    .login-secondary-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
    }

    .login-primary-actions .btn {
        min-height: 48px;
        font-size: 18px;
        font-weight: 600;
    }

    .login-secondary-actions .btn {
        min-height: 38px;
        white-space: normal;
    }

    @media (max-width: 360px) {
        .login-panel {
            padding: 18px;
        }

        .login-primary-actions,
        .login-secondary-actions {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-panel">
    <h1 class="login-title">Gerloff Painting Employee Login</h1>
    <form action="{% url 'login' %}" method="post" class="form-group mb-0" autocomplete="on">
        {% csrf_token %}
        <div class="form-text text-muted mb-2">
            Please enter your username or email address
        </div>
        <label class="sr-only" for="login-username">Username or email</label>
        <input value="{{ username|default:'' }}" type="text" id="login-username" name="username"
               autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
               inputmode="email"
               placeholder="Username or email" class="form-control" required autofocus><br>

        <label class="sr-only" for="login-password">Password</label>
        <div class="input-group">
            <input type="password" id="login-password" name="password"
                   autocomplete="current-password" placeholder="Password"
                   class="form-control" required>
            <div class="input-group-append">
                <button type="button" id="toggle-password"
                        class="btn btn-outline-secondary"
                        aria-label="Show password" aria-pressed="false"
                        title="Show password">
                    Show
                </button>
            </div>
        </div>

        <div class="login-primary-actions">
            <input type="submit" class="btn btn-primary" name="login" value="Log In">
            <input type="submit" class="btn btn-secondary" name="forgot" value="Forgot Password" formnovalidate>
        </div>

        <div class="login-secondary-actions">
            <input type="submit" class="btn btn-outline-primary btn-sm" name="register" value="Register New User With Pin" formnovalidate>
            <a href="{% url 'connect' %}" class="btn btn-outline-danger btn-sm">Subcontractors Click Here</a>
        </div>

        <div class="text-danger mt-3" role="alert">{{ message }}</div>
    </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const passwordInput = document.getElementById("login-password");
        const toggleButton = document.getElementById("toggle-password");

        if (!passwordInput || !toggleButton) {
            return;
        }

        passwordInput.setAttribute("type", "password");

        toggleButton.addEventListener("click", function () {
            const showPassword = passwordInput.type === "password";
            passwordInput.setAttribute("type", showPassword ? "text" : "password");
            toggleButton.textContent = showPassword ? "Hide" : "Show";
            toggleButton.setAttribute("aria-pressed", String(showPassword));
            toggleButton.setAttribute(
                "aria-label",
                showPassword ? "Hide password" : "Show password"
            );
            toggleButton.setAttribute(
                "title",
                showPassword ? "Hide password" : "Show password"
            );
        });
    });
</script>

{% endblock %}
